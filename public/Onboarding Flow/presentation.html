<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BytePe Onboarding Flow Presentation Deck</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #f1f5f9;        /* Soft light gray presentation background */
      --bg-slide: #ffffff;       /* Pure white slide background */
      --text-main: #0f172a;      /* Dark slate for high contrast text */
      --text-muted: #64748b;     /* Medium slate gray for secondary labels */
      --primary-orange: #ff4500;  /* Main brand orange */
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --border-color: #e2e8f0;   /* Clean light gray border */
      --font-family: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Presentation Header */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background-color: var(--primary-orange);
      color: white;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .deck-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Slide Arena */
    .slide-arena {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 640px;
      background-color: var(--bg-slide);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      display: grid;
      grid-template-columns: 45% 55%;
      overflow: hidden;
      position: relative;
    }

    /* Left Column: Speaking Points */
    .slide-content-col {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      background-color: #ffffff;
    }

    .slide-header {
      margin-bottom: 24px;
    }

    .slide-num-badge {
      color: var(--primary-orange);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: block;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-main);
    }

    .slide-bullets {
      list-style: none;
      margin-bottom: 24px;
    }

    .slide-bullets li {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155; /* Dark slate bullets for readability */
      margin-bottom: 14px;
      position: relative;
      padding-left: 20px;
    }

    .slide-bullets li::before {
      content: "•";
      color: var(--primary-orange);
      font-weight: bold;
      font-size: 1.2rem;
      position: absolute;
      left: 0;
      top: -2px;
    }

    .slide-bullets li strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .slide-footer-info {
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
    }

    /* Right Column: Screenshot Visual */
    .slide-visual-col {
      background-color: #f8fafc; /* Very light slate gray to frame the white bezel sidebars */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      height: 100%;
      overflow: hidden;
    }

    .screenshot-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screenshot-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* Ensures the image fits without cutting off */
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: opacity 0.3s ease;
    }

    /* Slide Navigation Controls */
    .controls-container {
      background-color: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .nav-btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-nav {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: var(--primary-orange);
      border-color: var(--primary-orange);
      color: white;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      background-color: #f8fafc;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      margin: 0 24px;
      height: 6px;
      background-color: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 8.33%;
      background-color: var(--primary-orange);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .slide-pagination {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
      min-width: 90px;
      text-align: right;
    }

    /* Hotkey Banner */
    .hotkey-banner {
      font-size: 0.75rem;
      color: var(--text-muted);
      background-color: #f1f5f9;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      display: inline-block;
    }

    .hotkey-key {
      background-color: #e2e8f0;
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--text-main);
      font-weight: bold;
    }

    /* Slide Content database */
    .slide-content-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 1. Header -->
  <header>
    <div class="logo-container">
      <div class="logo-badge">PROTOTYPE</div>
      <span class="logo-text">BytePe Assisted Onboarding</span>
    </div>
    <div class="deck-title">Interactive Presentation Slides</div>
    <div class="hotkey-banner">
      Press <span class="hotkey-key">←</span> or <span class="hotkey-key">→</span> arrow keys to navigate
    </div>
  </header>

  <!-- 2. Presentation Arena -->
  <div class="slide-arena">
    <div class="slide-wrapper" id="slide-wrapper">
      
      <!-- Left Column: Bullet Points -->
      <div class="slide-content-col">
        <div class="slide-body">
          <span class="slide-num-badge" id="slide-badge">Slide 1 of 12</span>
          <h2 class="slide-title" id="slide-title">Slide Title</h2>
          <div style="height: 20px;"></div>
          <ul class="slide-bullets" id="slide-bullets">
            <!-- Dynamically populated bullets -->
          </ul>
        </div>
        <div class="slide-footer-info">
          <span>BytePe Assisted Finance Product Deck</span>
          <span>Confidential</span>
        </div>
      </div>
      
      <!-- Right Column: Mockup Image -->
      <div class="slide-visual-col">
        <div class="screenshot-container">
          <img src="screenshots/slide1_login.png" alt="Slide Screenshot" class="screenshot-img" id="slide-img">
        </div>
      </div>
      
    </div>
  </div>

  <!-- 3. Bottom Navigation Controls -->
  <div class="controls-container">
    <div class="nav-btn-group">
      <button class="btn-nav" id="btn-prev" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Previous
      </button>
      <button class="btn-nav" id="btn-next">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    
    <div class="slide-pagination" id="slide-counter">
      1 / 12
    </div>
  </div>

  <!-- Slide Data Store -->
  <script>
    const SLIDES_DATA = [
      {
        badge: "Slide 1: Executive Login",
        title: "Assisted Login Portal",
        image: "screenshots/slide1_login.png",
        bullets: [
          "Secure onboarding panel engineered for field executives.",
          "Restricts login to registered employee ID: **BP100** for demo.",
          "Incorporates SMS OTP Challenge with static bypass **123456**.",
          "Features an **absolute OTP timer inside the input field** to prevent interface crowding.",
          "Clean visual layout removing all developer helper simulators."
        ]
      },
      {
        badge: "Slide 2: Executive Home / Dashboard",
        title: "Monthly KPI Metrics",
        image: "screenshots/slide2_dashboard.png",
        bullets: [
          "Unified dashboard presenting real-time onboarding metrics.",
          "Horizontal layout: **GMV (Green)** full width on top, and **Txns (Blue)**, **Active (Purple)**, and **Leads (Amber)** cards aligned below.",
          "Cards styled with **center-aligned numbers** and **lowercase 'this month' labels**.",
          "Full-width search bar to query partners by Reg ID or Phone number.",
          "Dynamic list at the bottom highlighting the active onboarding pipeline."
        ]
      },
      {
        badge: "Slide 3: Partners Directory",
        title: "Retailer Directory & Filters",
        image: "screenshots/slide3_partners.png",
        bullets: [
          "Comprehensive records of all merchants and lead drafts in the field.",
          "Filter records instantly by onboarding status: **All**, **Verified**, **Draft Lead**, and **KYC Pending**.",
          "Sort records dynamically by **Date**, **Shop Name (A-Z)**, or **City**.",
          "Separated retailer cards with colored left-border categories.",
          "Supports clicking directory cards to view details or resume progress."
        ]
      },
      {
        badge: "Slide 4: Lead Generation (Step 1)",
        title: "GPS-Locked Lead Capture",
        image: "screenshots/slide4_lead_gen.png",
        bullets: [
          "Mandatory location capture before merchant info can be entered.",
          "**GPS button captures coordinates** and reverse-geocodes city, state, and pincode.",
          "Step 1 form fields remain locked until location is successfully verified.",
          "Captures **Retailer Business Type** using a neat category dropdown list.",
          "Clean typography with input labels positioned directly **above input boxes**."
        ]
      },
      {
        badge: "Slide 5: Lead Success",
        title: "Unique Registration Code",
        image: "screenshots/slide5_lead_success.png",
        bullets: [
          "Confirmation screen showing successful lead generation.",
          "Auto-generates a structured **Registration ID** based on State, City, Month, and Counter.",
          "Includes a quick-action **Copy ID to Clipboard** button.",
          "Provides two clear paths: Return to Dashboard or proceed directly to KYC."
        ]
      },
      {
        badge: "Slide 6: KYC Registration (Step 2)",
        title: "Tax & Documents Capture",
        image: "screenshots/slide6_kyc.png",
        bullets: [
          "Collects essential business details and mandatory verification records.",
          "Interactive toggle handles conditional **GSTIN** vs **Udyam ID** inputs.",
          "Headers styled with bold, clean Orange formatting (**INTERESTED PARTNER INFO**).",
          "Visual slots to upload PAN, GST certificate, bank proof, and shop photos.",
          "Completely **hid raw browser file inputs** to remove overlapping text."
        ]
      },
      {
        badge: "Slide 7: Mobile OTP Verification",
        title: "Merchant Authentication",
        image: "screenshots/slide7_otp_verify.png",
        bullets: [
          "Fires verification code via SMS to the merchant's registered phone.",
          "Structured 4-digit OTP code entry slots with automatic cursor jumps.",
          "Includes a **45-second resend timer** to prevent duplicate SMS requests.",
          "Validates security code using static bypass registration code: **1234**."
        ]
      },
      {
        badge: "Slide 8: Final Success",
        title: "Onboarding Completed",
        image: "screenshots/slide8_final_success.png",
        bullets: [
          "Visual confirmation that the partner onboarding flow is finished.",
          "Displays full summary of shop name, owner, phone, and tax identifiers.",
          "Lists total verified documents uploaded during the flow.",
          "Instantly updates merchant record status to **Verified (Completed)** in LocalStorage."
        ]
      },
      {
        badge: "Slide 9: Performance Analytics (June)",
        title: "Dynamic Analytics Summary",
        image: "screenshots/slide9_analytics_june.png",
        bullets: [
          "Provides monthly analytics with dropdown selection (June, May, April 2026).",
          "Calculates current month **June 2026** performance dynamically using local database values.",
          "Displays a 2x2 grid card showing: **Revenue (GMV)**, **Transactions**, **Active**, and **Passive** partners.",
          "Renders dynamic conversion funnel rates and city splits.",
          "Automatically updates category count splits with colored legend dots."
        ]
      },
      {
        badge: "Slide 10: Performance Analytics (May)",
        title: "Historical Month Analytics",
        image: "screenshots/slide10_analytics_may.png",
        bullets: [
          "Dropdown filter updates all metrics to simulated historical May figures.",
          "Renders **₹16,84,500 Revenue** and **1,280 Transactions** for May.",
          "Displays **28 Active** and **15 Passive** partners.",
          "Cohesively shifts funnel bars and city records to reflect May data.",
          "Provides a complete month-on-month analysis of executive KPIs."
        ]
      },
      {
        badge: "Slide 11: Geolocation Attendance",
        title: "Attendance Profile Overview",
        image: "screenshots/slide11_profile.png",
        bullets: [
          "Executive profile screen displaying employee credentials (Amit Kumar, BP100).",
          "Includes a **Mark Punch-In** button that queries active GPS coordinates.",
          "Resolves street-level address using OpenStreetMap Nominatim reverse geocoding.",
          "Maintains attendance logs showing time, status, and resolved address."
        ]
      },
      {
        badge: "Slide 12: Attendance Verification Log",
        title: "Punched In Profile State",
        image: "screenshots/slide12_profile_punched.png",
        bullets: [
          "Displays a clear green `🟢 Punched In` badge on the profile header.",
          "Shows resolved GPS log with timestamp and street-level location.",
          "Disables the Punch-In button to prevent duplicate submissions.",
          "Caches punched status in LocalStorage to persist even after reloading the page."
        ]
      }
    ];

    let currentSlideIndex = 0;

    // DOM Elements
    const badgeEl = document.getElementById("slide-badge");
    const titleEl = document.getElementById("slide-title");
    const bulletsEl = document.getElementById("slide-bullets");
    const imgEl = document.getElementById("slide-img");
    const counterEl = document.getElementById("slide-counter");
    const progressFillEl = document.getElementById("progress-fill");
    
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    function renderSlide(index) {
      const data = SLIDES_DATA[index];
      
      // Update Text
      badgeEl.innerText = data.badge;
      titleEl.innerText = data.title;
      
      // Render Bullets with markdown-like bold highlights
      bulletsEl.innerHTML = "";
      data.bullets.forEach(bullet => {
        const li = document.createElement("li");
        
        // Simple Markdown replacement for **text**
        let formattedText = bullet.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        li.innerHTML = formattedText;
        bulletsEl.appendChild(li);
      });
      
      // Update Image
      imgEl.src = data.image;
      
      // Update Nav buttons
      btnPrev.disabled = index === 0;
      btnNext.disabled = index === SLIDES_DATA.length - 1;
      
      // Update Pagination & Progress Fill
      counterEl.innerText = `${index + 1} / ${SLIDES_DATA.length}`;
      const percentage = ((index + 1) / SLIDES_DATA.length) * 100;
      progressFillEl.style.width = `${percentage}%`;
    }

    // Nav Action Handlers
    function goToNextSlide() {
      if (currentSlideIndex < SLIDES_DATA.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    }

    function goToPrevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    }

    btnNext.addEventListener("click", goToNextSlide);
    btnPrev.addEventListener("click", goToPrevSlide);

    // Keyboard Listeners
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        goToNextSlide();
      } else if (e.key === "ArrowLeft") {
        goToPrevSlide();
      }
    });

    // Initial Render
    renderSlide(currentSlideIndex);
  </script>
</body>
</html>
